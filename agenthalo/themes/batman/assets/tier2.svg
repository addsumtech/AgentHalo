<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
<defs><style>
#arm-L { transform-origin: 2.25px 9.5px; } #arm-R { transform-origin: 13.75px 9.5px; }
#arm-R { transform: rotate(150deg); }

.breathe { transform-origin: 7.5px 15px; animation: breathe 3.4s infinite ease-in-out; }
@keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.015,0.985); } }
.pupils { transform-origin: 7.5px 4.8px; animation: blink 4.6s infinite ease-in-out; }
@keyframes blink { 0%,8%,100% { transform: scaleY(1); } 4% { transform: scaleY(0.1); } }
#eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }
#shadow-js { transform-origin: 7.5px 15px; }

.thumb { animation: tap 0.3s infinite alternate ease-in-out; }
@keyframes tap { from { transform: translateY(0); } to { transform: translateY(-0.4px); } }
.dots rect { animation: dot 1.2s infinite both; } .dots rect:nth-child(2) { animation-delay: 0.2s; } .dots rect:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
.fly { animation: fly 4s infinite linear both; }
@keyframes fly { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(6px,-9px); opacity: 0; } }
.inspect { transform-origin: 12px 5px; animation: inspect 2.4s infinite ease-in-out; }
@keyframes inspect { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

</style></defs>
<polygon points="4,8 12,8 16,15 12,14 10,15 8,14 6,15 4,14 0,15" fill="#1C2836" /><g id="shadow-js"><rect x="2.5" y="15.3" width="11" height="0.9" fill="#000000" opacity="0.35"/></g>
<g id="leg-L"><rect x="4" y="13" width="2.8" height="1.8" fill="#222C39"/><rect x="3.5" y="14.3" width="3.8" height="1.2" fill="#222C39"/></g><g id="leg-R"><rect x="9" y="13" width="2.8" height="1.8" fill="#222C39"/><rect x="8.5" y="14.3" width="3.8" height="1.2" fill="#222C39"/></g>
<g id="body-js"><g class="breathe">
<g id="arm-L"><rect x="0.9" y="9" width="1.7" height="3.8" fill="#39414C"/><rect x="0.6" y="12" width="2.3" height="1.7" fill="#202C39"/></g>
<g id="arm-R"><rect x="13.3" y="9" width="1.7" height="3.8" fill="#39414C"/><rect x="13" y="12" width="2.3" height="1.7" fill="#202C39"/></g>
<rect x="2.4" y="9" width="11.2" height="4.7" fill="#39414C"/><ellipse cx="8" cy="10.6" rx="3.6" ry="1.4" fill="#DFC44F"/><polygon points="4.8,10 6.3,10.6 7,9.8 7.5,10.4 8.5,10.4 9,9.8 9.7,10.6 11.2,10 10.6,11.2 9,11.2 8,12 7,11.2 5.4,11.2" fill="#1E2A47" /><rect x="2.4" y="13" width="11.2" height="1" fill="#D4AD43"/><rect x="7.2" y="12.8" width="1.6" height="1.4" fill="#F2D466"/>

<g id="head">
<polygon points="1,2 1,-7 4,-4 5,-2 11,-2 12,-4 15,-7 15,6 13,7 3,7 1,6" fill="#222C39" /><polygon points="5,5 11,5 12,7 10,9 6,9 4,7" fill="#D6AC88" /><polygon points="2,-2 4,-1 4,3 2,4" fill="#354251" />

<polygon points="3,2 6.5,2.8 6,3.6 3.5,3.2" fill="#FFFFFF" /><polygon points="9.5,2.8 13,2 12.5,3.2 10,3.6" fill="#FFFFFF" /><rect x="6" y="6.9" width="4" height="0.4" fill="#735A4C"/>
</g>
<g class="inspect" transform="translate(11 4)"><circle cx="3" cy="2.5" r="3" fill="#E7CD65"/><polygon points="0,1.5 1.5,2 2,1 3,2 4,1 4.5,2 6,1.5 5,3 4,3 3,4 2,3 1,3" fill="#1E2A47" /></g>
</g></g>

</svg>
