<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
<defs><style>
#arm-L { transform-origin: 2.25px 9.5px; } #arm-R { transform-origin: 13.75px 9.5px; }


.breathe { transform-origin: 7.5px 15px; animation: breathe 3.4s infinite ease-in-out; }
@keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.015,0.985); } }
.pupils { transform-origin: 7.5px 4.8px; animation: blink 4.6s infinite ease-in-out; }
@keyframes blink { 0%,8%,100% { transform: scaleY(1); } 4% { transform: scaleY(0.1); } }
#eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }
#shadow-js { transform-origin: 7.5px 15px; }

.keepsake { transform-origin: 16px 8px; animation: show 3s infinite ease-in-out; }
@keyframes show { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(8deg) translateY(-1px); } }
#arm-R { transform: rotate(-105deg); }

</style></defs>
<g id="shadow-js"><rect x="2.5" y="15.3" width="11" height="0.9" fill="#000000" opacity="0.35"/></g>
<g id="leg-L"><rect x="4" y="13.2" width="3" height="1.1" fill="#FFD349"/><rect x="4.5" y="14.2" width="2" height="0.6" fill="#F3C69B"/><rect x="3.8" y="14.8" width="3.4" height="0.6" fill="#EFD785"/></g><g id="leg-R"><rect x="9" y="13.2" width="3" height="1.1" fill="#FFD349"/><rect x="9.5" y="14.2" width="2" height="0.6" fill="#F3C69B"/><rect x="8.8" y="14.8" width="3.4" height="0.6" fill="#EFD785"/></g>
<g id="body-js"><g class="breathe">
<g id="arm-L">
<rect x="1.5" y="9.3" width="1.5" height="4" fill="#ED3D43"/>
<rect x="1.6" y="13.1" width="1.3" height="1.1" fill="#F3C69B"/>
</g>
<g id="arm-R">
<rect x="13" y="9.3" width="1.5" height="4" fill="#ED3D43"/>
<rect x="13.1" y="13.1" width="1.3" height="1.1" fill="#F3C69B"/>
</g>
<rect x="3" y="9" width="10" height="4.6" fill="#ED3D43"/>

<g id="head">
<polygon points="3,0 12,0 14,2 14,4 17,5 17,8 14,10 6,10 2,8 0,5 1,2" fill="#F3C69B" /><rect x="14" y="6" width="2" height="1" fill="#E7A992"/>
<polygon points="0,3 0,0 2,-2 5,-3 11,-3 14,-1 15,2 14,3 12,1 3,1 2,3" fill="#202634" />
<polygon points="3,3 4,2 6,2 7,3 7,4 5,3 3,4" fill="#1E2A47" /><polygon points="8,3 9,2 11,2 12,3 12,4 10,3 8,4" fill="#1E2A47" /><g ><g class="pupils"><rect x="4.5" y="4.7" width="1.1" height="1.7" fill="#1E2A47"/><rect x="9.5" y="4.7" width="1.1" height="1.7" fill="#1E2A47"/></g></g><rect x="11" y="8" width="1.3" height="0.7" fill="#9E4E43"/>
</g>

</g></g>
<g class="keepsake"><g class="" transform="translate(15 5)"><rect x="0" y="1" width="5.8" height="4.7" fill="#F3C735"/><rect x="0.6" y="1.5" width="4.6" height="3.7" fill="#FFF1D5"/><rect x="1.4" y="2.4" width="3" height="1.9" fill="#644534"/><rect x="1.7" y="2.6" width="0.6" height="0.6" fill="#AC7750"/></g></g>
</svg>
