<g id="arm-R"><rect x="13.3" y="9" width="1.7" height="3.8" fill="#256EBB"/><rect x="13" y="12" width="2.3" height="1.7" fill="#FFFFFF"/></g>
<polygon points="5,8 11,8 12,11 10,14 6,14 4,11" fill="#256EBB" /><ellipse cx="8" cy="10.8" rx="2.3" ry="2.8" fill="#EDD0A4"/>

