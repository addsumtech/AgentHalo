<g id="arm-R"><rect x="13.3" y="9" width="1.7" height="3.8" fill="#D83B40"/><rect x="13" y="12" width="2.3" height="1.7" fill="#FFFFFF"/></g>
<rect x="2" y="9" width="12" height="4.7" fill="#D83B40"/><rect x="4" y="9" width="1.5" height="5" fill="#3072B1"/><rect x="10.5" y="9" width="1.5" height="5" fill="#3072B1"/><rect x="4" y="11" width="8" height="3" fill="#3072B1"/><rect x="4.5" y="10.7" width="0.8" height="0.8" fill="#F7CE51"/><rect x="10.7" y="10.7" width="0.8" height="0.8" fill="#F7CE51"/>

