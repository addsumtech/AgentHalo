@keyframes zz { 0% { transform: translate(0,0) scale(0.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(4px,-9px) scale(1.3); opacity: 0; } }
#shadow-js { transform-origin: 7.5px 15px; }

