<g id="body-js"><g class="breathe">
<g id="arm-L"><rect x="0.9" y="9" width="1.7" height="3.8" fill="#8A969C"/></g>
<g id="arm-R"><rect x="13.3" y="9" width="1.7" height="3.8" fill="#8A969C"/></g>

<g id="laptop"><rect x="3.6" y="12.2" width="8.8" height="1.2" fill="#4A5468"/><rect x="4.2" y="8.6" width="7.6" height="3.7" fill="#8A93A6"/><rect x="4.6" y="9" width="6.8" height="2.9" fill="#0B1F00"/><rect x="5" y="9.4" width="2.6" height="0.5" fill="#76B900" class="code1"/><rect x="5" y="10.2" width="4" height="0.5" fill="#FFFFFF" class="code2"/><rect x="5" y="11" width="3.2" height="0.5" fill="#A3E635" class="code3"/><g class="hand-l"><rect x="5" y="11.4" width="1.4" height="0.9" fill="#8A969C"/></g><g class="hand-r"><rect x="9.6" y="11.4" width="1.4" height="0.9" fill="#8A969C"/></g></g>
